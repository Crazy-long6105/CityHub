server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    hikari:
      connection-timeout: 2000
    driver-class-name: com.mysql.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/db_hmdp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  redis:
    timeout: 200ms
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jdbc:
    template:
      query-timeout: 2s
  jackson:
    default-property-inclusion: non_null
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 200
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        buffer.memory: 1048576
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      operation-timeout: 30s
    consumer:
      group-id: seckill_group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.hmdp.dto
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      concurrency: 3
mybatis-plus:
  configuration:
    default-statement-timeout: 2
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS

hmdp:
  instance-id: ${HMDP_INSTANCE_ID:local-1}
  business-zone: Asia/Shanghai
  seckill:
    enabled: ${HMDP_SECKILL_ENABLED:false}
    query-secret: ${HMDP_SECKILL_QUERY_SECRET:}
    recovery-delay-ms: 1000
  order:
    pay-seconds: 900
    lifecycle:
      enabled: ${HMDP_ORDER_LIFECYCLE_ENABLED:false}

